name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NDK_VERSION: 27.0.12077973
  BUILD_TOOLS_VERSION: 34.0.0

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      has_publish_token: ${{ steps.check_publish.outputs.has_publish_token }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Install NDK and build-tools
      # The runner has the Android SDK preinstalled. The NDK version
      # must match ndkVersion in app/build.gradle.
      run: |
        echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS_VERSION"

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check for publish token
      id: check_publish
      env:
        HYDRARELEASE_TOKEN: ${{ secrets.HYDRARELEASE_PUBLISH_TOKEN }}
      run: |
        if [ -n "$HYDRARELEASE_TOKEN" ]; then
          echo "has_publish_token=true" >> $GITHUB_OUTPUT
        else
          echo "has_publish_token=false" >> $GITHUB_OUTPUT
        fi

    - name: Build release APK (nonRoot flavor)
      run: |
        chmod +x gradlew
        ./gradlew assembleNonRootRelease

    - name: Collect unsigned APK
      run: |
        mkdir -p dist
        APK=$(find app/build/outputs/apk/nonRoot/release -name '*.apk' | head -n 1)
        if [ -z "$APK" ]; then
          echo "No APK found" >&2
          exit 1
        fi
        cp "$APK" dist/hydraheadquest-unsigned.apk

    - name: Sign APK with apksigner
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        VERSION=${{ steps.get_version.outputs.version }}
        BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
        "$BT/zipalign" -f -p 4 dist/hydraheadquest-unsigned.apk dist/hydraheadquest-aligned.apk
        "$BT/apksigner" sign \
          --ks keystore.jks \
          --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
          --ks-key-alias "$ANDROID_KEY_ALIAS" \
          --key-pass "pass:$ANDROID_KEY_PASSWORD" \
          --out "dist/hydraheadquest-$VERSION.apk" \
          dist/hydraheadquest-aligned.apk
        rm -f keystore.jks dist/hydraheadquest-unsigned.apk dist/hydraheadquest-aligned.apk

    - name: No keystore secrets set, APK stays unsigned
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
      run: |
        VERSION=${{ steps.get_version.outputs.version }}
        mv dist/hydraheadquest-unsigned.apk "dist/hydraheadquest-$VERSION.apk"

    - name: Checksums
      run: |
        cd dist && sha256sum * > SHA256SUMS

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: hydraheadquest-apk
        path: dist/
        if-no-files-found: error

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        generate_release_notes: true
        files: |
          dist/*.apk
          dist/SHA256SUMS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to release server
    runs-on: ubuntu-latest
    needs: build
    # Skip gracefully when the repo has no publish token yet.
    if: ${{ needs.build.outputs.has_publish_token == 'true' }}
    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: hydraheadquest-apk
        path: dist

    - name: Publish to releases.experiencenet.com
      env:
        HYDRARELEASE_TOKEN: ${{ secrets.HYDRARELEASE_PUBLISH_TOKEN }}
      run: |
        VERSION=${{ needs.build.outputs.version }}
        SERVER="https://releases.experiencenet.com"
        PROJECT="hydraheadquest"
        if [[ "$VERSION" == *"-rc"* ]] || [[ "$VERSION" == *"-beta"* ]]; then
          CHANNEL="staging"
        else
          CHANNEL="production"
        fi
        echo "Publishing to channel: $CHANNEL"

        for file in dist/*; do
          [ -f "$file" ] || continue
          name=$(basename "$file")
          [ "$name" = "SHA256SUMS" ] && continue
          [ "$name" = "latest.json" ] && continue
          echo "Uploading $name..."
          curl -sf -X POST \
            -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/$VERSION/$name"
        done

        echo "Finalizing..."
        curl -sf -X POST \
          -H "Authorization: Bearer $HYDRARELEASE_TOKEN" \
          "$SERVER/api/v1/publish/$PROJECT/$CHANNEL/$VERSION/finalize"
