name: Build

on:
  push:
    branches:
      - master

env:
  NDK_VERSION: 27.0.12077973

jobs:
  build:
    name: Compile smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Install NDK
      # The runner has the Android SDK preinstalled. The NDK version
      # must match ndkVersion in app/build.gradle.
      run: |
        echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

    - name: Build release APK (nonRoot flavor)
      run: |
        chmod +x gradlew
        ./gradlew assembleNonRootRelease
